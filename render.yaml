# Render blueprint: one web service runs the FastAPI server (rag/api.py), which also serves the built React app.
# Render dashboard -> New -> Blueprint -> pick this repo. It asks for GEMINI_API_KEY (https://aistudio.google.com/apikey).
services:
  - type: web
    name: sotonship2026
    runtime: python
    branch: feature/simulator
    plan: free
    buildCommand: >-
      pip install -r requirements-web.txt &&
      cd frontend && npm ci && npm run build && cd .. &&
      python -m rag index
    startCommand: python -c "from rag.api import main; main()"
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: NODE_VERSION
        value: 22.12.0
